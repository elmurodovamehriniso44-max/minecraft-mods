services:
  - type: web
    name: shazam-music-bot
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: CHANNEL_URL
        sync: false
      - key: MAX_PARALLEL_JOBS
        value: "1"
